# Keeps dependencies, base images and workflow actions current. Updates arrive as pull requests that must pass the full CI/CD gate.
# Note: Dependabot updates requirements*.txt; regenerate requirements.lock afterwards (sh scripts/refresh_lock.sh) so the image and CI stay pinned.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: "/"
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: "/"
    schedule: {interval: weekly}
