# Starter OpenTelemetry Collector configuration: receive OTLP from PharmaGuard AI, expose Prometheus metrics, forward traces.
receivers:
  otlp:
    protocols:
      grpc: {endpoint: 0.0.0.0:4317}
      http: {endpoint: 0.0.0.0:4318}
processors:
  batch: {}
  attributes/env:
    actions:
      - {key: deployment.environment, value: demo, action: upsert}
exporters:
  debug: {verbosity: basic}
  prometheus: {endpoint: 0.0.0.0:8889}
  # otlphttp/vendor:                      # uncomment and point at your backend (Tempo, Jaeger, Datadog, Honeycomb, ...)
  #   endpoint: https://otlp.example.com
  #   headers: {authorization: "Bearer ${env:OTLP_TOKEN}"}   # secret injected from the environment, never committed
service:
  pipelines:
    traces:  {receivers: [otlp], processors: [attributes/env, batch], exporters: [debug]}
    metrics: {receivers: [otlp], processors: [batch], exporters: [prometheus]}
    logs:    {receivers: [otlp], processors: [batch], exporters: [debug]}
